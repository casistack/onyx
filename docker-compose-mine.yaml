name: onyx

x-onyx-common-env: &onyx-common-env
  AUTH_TYPE: ${AUTH_TYPE:-basic}
  WEB_DOMAIN: ${WEB_DOMAIN:?required}
  SESSION_EXPIRE_TIME_SECONDS: ${SESSION_EXPIRE_TIME_SECONDS:-604800}
  USER_AUTH_SECRET: ${USER_AUTH_SECRET:?required}
  ENCRYPTION_KEY_SECRET: ${ENCRYPTION_KEY_SECRET:-}
  ENABLE_PAID_ENTERPRISE_EDITION_FEATURES: ${ENABLE_PAID_ENTERPRISE_EDITION_FEATURES:-false}
  FILE_STORE_BACKEND: ${FILE_STORE_BACKEND:-s3}
  POSTGRES_HOST: relational_db
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
  VESPA_HOST: index
  OPENSEARCH_HOST: ${OPENSEARCH_HOST:-opensearch}
  OPENSEARCH_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?required}
  ENABLE_OPENSEARCH_INDEXING_FOR_ONYX: ${OPENSEARCH_FOR_ONYX_ENABLED:-true}
  REDIS_HOST: cache
  MODEL_SERVER_HOST: ${MODEL_SERVER_HOST:-inference_model_server}
  CODE_INTERPRETER_BASE_URL: ${CODE_INTERPRETER_BASE_URL:-http://code-interpreter:8000}
  USE_IAM_AUTH: ${USE_IAM_AUTH:-false}
  AWS_REGION_NAME: ${AWS_REGION_NAME:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_AWS_ACCESS_KEY_ID: ${S3_AWS_ACCESS_KEY_ID:?required}
  S3_AWS_SECRET_ACCESS_KEY: ${S3_AWS_SECRET_ACCESS_KEY:?required}
  PERSISTENT_DOCUMENT_STORAGE_PATH: ${PERSISTENT_DOCUMENT_STORAGE_PATH:-/app/file-system}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
  OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
  OPENID_CONFIG_URL: ${OPENID_CONFIG_URL:-}
  OIDC_PKCE_ENABLED: ${OIDC_PKCE_ENABLED:-}
  SAML_CONF_DIR: ${SAML_CONF_DIR:-}
  VALID_EMAIL_DOMAINS: ${VALID_EMAIL_DOMAINS:-}

services:
  api_server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      /bin/sh -c "alembic upgrade head &&
      echo \"Starting Onyx Api Server\" &&
      uvicorn onyx.main:app --host 0.0.0.0 --port 8080"
    depends_on:
      relational_db:
        condition: service_healthy
      index:
        condition: service_started
      opensearch:
        condition: service_started
      cache:
        condition: service_started
      inference_model_server:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped
    environment:
      <<: *onyx-common-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api_server_logs:/var/log/onyx
      - file-system:/app/file-system
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 25s

  background:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      /bin/sh -c "if [ -f /etc/ssl/certs/custom-ca.crt ]; then
        update-ca-certificates;
      fi &&
      /app/scripts/supervisord_entrypoint.sh"
    depends_on:
      relational_db:
        condition: service_healthy
      index:
        condition: service_started
      opensearch:
        condition: service_started
      cache:
        condition: service_started
      inference_model_server:
        condition: service_started
      indexing_model_server:
        condition: service_started
    restart: unless-stopped
    environment:
      <<: *onyx-common-env
      INDEXING_MODEL_SERVER_HOST: ${INDEXING_MODEL_SERVER_HOST:-indexing_model_server}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_BOT_INVOKE_CHAR: ${DISCORD_BOT_INVOKE_CHAR:-!}
      API_SERVER_PROTOCOL: ${API_SERVER_PROTOCOL:-http}
      API_SERVER_HOST: ${API_SERVER_HOST:-api_server}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - background_logs:/var/log/onyx
      - file-system:/app/file-system
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  web_server:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_DISABLE_LOGOUT=${NEXT_PUBLIC_DISABLE_LOGOUT:-}
        - NEXT_PUBLIC_FORGOT_PASSWORD_ENABLED=${NEXT_PUBLIC_FORGOT_PASSWORD_ENABLED:-}
        - NEXT_PUBLIC_THEME=${NEXT_PUBLIC_THEME:-}
        - NEXT_PUBLIC_DO_NOT_USE_TOGGLE_OFF_DANSWER_POWERED=${NEXT_PUBLIC_DO_NOT_USE_TOGGLE_OFF_DANSWER_POWERED:-false}
        - NODE_OPTIONS=${NODE_OPTIONS:-"--max-old-space-size=4096"}
    depends_on:
      - api_server
    restart: unless-stopped
    environment:
      <<: *onyx-common-env
      INTERNAL_URL: ${INTERNAL_URL:-http://api_server:8080}
      NEXT_PUBLIC_DISABLE_LOGOUT: ${NEXT_PUBLIC_DISABLE_LOGOUT:-}
      NEXT_PUBLIC_FORGOT_PASSWORD_ENABLED: ${NEXT_PUBLIC_FORGOT_PASSWORD_ENABLED:-}
      NEXT_PUBLIC_THEME: ${NEXT_PUBLIC_THEME:-}
      NEXT_PUBLIC_DO_NOT_USE_TOGGLE_OFF_DANSWER_POWERED: ${NEXT_PUBLIC_DO_NOT_USE_TOGGLE_OFF_DANSWER_POWERED:-false}
    ports:
      - ':3000'

  inference_model_server:
    build:
      context: ./backend
      dockerfile: Dockerfile.model_server
    command: >
      /bin/sh -c "if [ \"${DISABLE_MODEL_SERVER:-}\" = \"True\" ] || [ \"${DISABLE_MODEL_SERVER:-}\" = \"true\" ]; then
        echo 'Skipping service...';
        exit 0;
      else
        exec uvicorn model_server.main:app --host 0.0.0.0 --port 9000;
      fi"
    restart: unless-stopped
    environment:
      MIN_THREADS_ML_MODELS: ${MIN_THREADS_ML_MODELS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - model_cache_huggingface:/app/.cache/huggingface/
      - inference_model_server_logs:/var/log/onyx
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3

  indexing_model_server:
    build:
      context: ./backend
      dockerfile: Dockerfile.model_server
    command: >
      /bin/sh -c "if [ \"${DISABLE_MODEL_SERVER:-}\" = \"True\" ] || [ \"${DISABLE_MODEL_SERVER:-}\" = \"true\" ]; then
        echo 'Skipping service...';
        exit 0;
      else
        exec uvicorn model_server.main:app --host 0.0.0.0 --port 9000;
      fi"
    restart: unless-stopped
    environment:
      INDEXING_ONLY: "True"
      MIN_THREADS_ML_MODELS: ${MIN_THREADS_ML_MODELS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      VESPA_SEARCHER_THREADS: ${VESPA_SEARCHER_THREADS:-1}
    volumes:
      - indexing_huggingface_model_cache:/app/.cache/huggingface/
      - indexing_model_server_logs:/var/log/onyx
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3

  relational_db:
    image: ${POSTGRES_IMAGE:-postgres:15.2-alpine}
    shm_size: 1g
    command: -c 'max_connections=250'
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - db_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  index:
    image: ${VESPA_IMAGE:-vespaengine/vespa:8.609.39}
    restart: unless-stopped
    environment:
      VESPA_SKIP_UPGRADE_CHECK: ${VESPA_SKIP_UPGRADE_CHECK:-true}
    volumes:
      - vespa_volume:/opt/vespa/var
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  opensearch:
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:3.4.0}
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:?required}
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  cache:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    tmpfs:
      - /data

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
      MINIO_DEFAULT_BUCKETS: ${S3_FILE_STORE_BUCKET_NAME:-onyx-file-store-bucket}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  code-interpreter:
    image: onyxdotapp/code-interpreter:${CODE_INTERPRETER_IMAGE_TAG:-latest}
    command: ["bash", "./entrypoint.sh", "code-interpreter-api"]
    restart: unless-stopped
    user: root
    volumes:
      - ${DOCKER_SOCK_PATH:-/var/run/docker.sock}:/var/run/docker.sock

volumes:
  db_volume:
  vespa_volume:
  minio_data:
  model_cache_huggingface:
  indexing_huggingface_model_cache:
  api_server_logs:
  background_logs:
  inference_model_server_logs:
  indexing_model_server_logs:
  file-system:
  opensearch-data:
